<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>Formatura • Carolina Magalhães</title><style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}
body{display:grid;place-items:center;font-family:Georgia,serif}
.canvas{position:relative;aspect-ratio:1086/1448;width:min(100vw,75dvh);height:auto;max-height:100dvh;overflow:hidden;isolation:isolate;background:#fff;box-shadow:0 2px 36px #0e275215}
.invitation{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:2;clip-path:polygon(0 100%,10% 100%,20% 100%,30% 100%,40% 100%,50% 100%,60% 100%,70% 100%,80% 100%,90% 100%,100% 100%,100% 100%,0 100%);will-change:clip-path}
.veil{position:absolute;inset:0;background:#fff;z-index:3;pointer-events:none;transition:opacity 1s ease}
.psy{position:absolute;left:50%;top:48%;font-family:Georgia,serif;font-size:clamp(92px,21vw,165px);line-height:1;color:#143e9b;z-index:9;opacity:0;transform:translate(-50%,-50%) scale(.85);transition:opacity .55s ease,transform .85s cubic-bezier(.22,.8,.2,1)}
/* Flores independentes: nenhum painel, coluna ou imagem dividida ao meio. */
.fl{display:none}
.flower-field{position:absolute;inset:0;z-index:7;overflow:hidden;pointer-events:none;contain:paint}
.bloom{position:absolute;left:var(--x);top:var(--y);width:var(--w);height:auto;opacity:1;transform:translate(-50%,-50%) rotate(var(--rot)) scale(var(--scale));transform-origin:center;filter:drop-shadow(0 2px 2px #163a6b13);backface-visibility:hidden}
.scene-clear .bloom{animation:scatter var(--dur) var(--delay) cubic-bezier(.22,.38,.28,1) both}
@keyframes scatter{
0%{opacity:1;transform:translate(-50%,-50%) rotate(var(--rot)) scale(var(--scale))}
20%{opacity:1}
42%{opacity:.92;transform:translate(calc(-50% + var(--mx)),calc(-50% + var(--my))) rotate(var(--midrot)) scale(.92)}
70%{opacity:0}
100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(var(--endrot)) scale(.64)}
}
.scene-symbol .psy{opacity:1;transform:translate(-50%,-50%) scale(1)}
.scene-birds .psy{opacity:0;transform:translate(-50%,-54%) scale(.92)}
.scene-birds .veil{opacity:0}
.scene-birds .invitation{animation:reveal-wave 4.65s linear both}
@keyframes reveal-wave{
0%{clip-path:polygon(0 100%,10% 100%,20% 100%,30% 100%,40% 100%,50% 100%,60% 100%,70% 100%,80% 100%,90% 100%,100% 100%,100% 100%,0 100%)}
12%{clip-path:polygon(0 95%,10% 94%,20% 95%,30% 93%,40% 95%,50% 94%,60% 93%,70% 95%,80% 94%,90% 93%,100% 95%,100% 100%,0 100%)}
36%{clip-path:polygon(0 82%,10% 80%,20% 81%,30% 78%,40% 80%,50% 79%,60% 78%,70% 81%,80% 80%,90% 78%,100% 81%,100% 100%,0 100%)}
57%{clip-path:polygon(0 62%,10% 59%,20% 61%,30% 58%,40% 60%,50% 58%,60% 59%,70% 61%,80% 58%,90% 60%,100% 61%,100% 100%,0 100%)}
76%{clip-path:polygon(0 34%,10% 32%,20% 33%,30% 30%,40% 32%,50% 31%,60% 30%,70% 33%,80% 31%,90% 32%,100% 33%,100% 100%,0 100%)}
100%{clip-path:polygon(0 0%,10% 0%,20% 0%,30% 0%,40% 0%,50% 0%,60% 0%,70% 0%,80% 0%,90% 0%,100% 0%,100% 100%,0 100%)}
}
.birds{position:absolute;inset:0;z-index:8;pointer-events:none;overflow:hidden}
.bird{position:absolute;left:var(--x);top:var(--y);height:30px;width:clamp(22px,6vw,48px);opacity:0;color:#164899;transform:translate(-50%,-50%) scale(.48)}
.bird svg{width:100%;height:100%;display:block;overflow:visible}
.bird path{fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.scene-birds .bird{animation:fly 2.4s var(--delay) cubic-bezier(.25,.4,.26,1) both}
.scene-birds .bird svg{animation:flap .38s ease-in-out infinite alternate}
@keyframes fly{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}15%{opacity:1}62%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.88)}}
@keyframes flap{from{transform:scaleY(.66)}to{transform:scaleY(1.1)}}
.location{position:absolute;left:29.2%;top:68%;height:5.4%;width:22.5%;z-index:5;pointer-events:none;opacity:0;transition:opacity .5s}
.location::after{content:'';position:absolute;left:0;right:0;top:100%;height:1px;background:#e3a04a;border-radius:1px}
.scene-finish .location{opacity:1;pointer-events:auto}
.replay{position:fixed;right:14px;bottom:max(12px,env(safe-area-inset-bottom));border:0;border-radius:22px;background:#153f98;color:#fff;font:600 12px system-ui;padding:11px 15px;cursor:pointer;box-shadow:0 4px 16px #14365b35;z-index:20}
.hint{position:fixed;bottom:max(16px,env(safe-area-inset-bottom));left:14px;font:11px system-ui;color:#6c7590}
@media(max-width:440px){.hint{display:none}}
@media(prefers-reduced-motion:reduce){.scene-clear .bloom{animation-duration:.01s}.psy,.veil{transition-duration:.05s}.scene-birds .bird,.scene-birds .bird svg,.scene-birds .invitation{animation-duration:.05s}}
</style></head><body>
